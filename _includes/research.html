  <div class="section__title">Research</div>

    <div class="project">
    <div class="project IRAS4B"> 
    <div class="project__name">
      <a href="https://ui.adsabs.harvard.edu/abs/2026A%26A...708A.315B/abstract" target="_blank">
        <u>PRODIGE: Molecular inventory of the NGC1333 IRAS4B1 Class 0 protostellar outflow</u>
      </a>
    </div>
    <figure class="project__pic">
      <a href="https://ui.adsabs.harvard.edu/abs/2026A%26A...708A.315B/abstract" target="_blank">
        <div class="IRAS 4B">
          <img src="{{site.baseurl}}/img/research/laura_final_4b.png" alt="">
        </div>
      </a>
    </figure>
    <figcaption class="project__caption">
        <p href="https://ui.adsabs.harvard.edu/abs/2026A%26A...708A.315B/abstract" target="_blank">
          We introduced the NGC1333 IRAS4B1 protostellar outflow as a new laboratory for studying shock-driven COM chemistry. Using PRODIGE data, spatially resolved molecular emission and LTE spectral analysis reveal a chemically rich outflow containing several COMs, including CH<sub>3</sub>OH, CH<sub>3</sub>CN, CH<sub>3</sub>CHO, and, CH<sub>2</sub>DOH. Gradients along both outflow lobes in integrated-intensity between CH<sub>3</sub>OH and DCN and D<sub>2</sub>CO may reflect pre-stellar abundance profiles. Integrated-intensity ratios HC<sub>3</sub>N/CH<sub>3</sub>OH and CH<sub>3</sub>CN/CH<sub>3</sub>OH peak in the warmer southern lobe, potentially indicating enhanced gas-phase formation. Differences in molecular distributions and intensity ratios between the two outflow lobes suggest that both pre-stellar chemistry and warm gas-phase processes influence the observed composition. The outflow is warmer and shows higher COM abundances than the well-studied L1157-B1 shock. These results demonstrate that IRAS4B1 is a promising target for follow-up observations to investigate COM formation and destruction and the connection between shock chemistry, outflow structure, and kinematics.
        </p>
    </figcaption>
  </div>

  <div class="project">
    <div class="project 12C/13C">
    <div class="project__name">
      <a href="https://ui.adsabs.harvard.edu/abs/2025A%26A...699A.359B/abstract" target="_blank">
        <u> PRODIGE: <sup>12</sup>C/<sup>13</sup>C ratio in Class 0/I hot corinos</u>
      </a>
    </div>
      <figure class="project__pic pic-12c13c">

        <a href="https://ui.adsabs.harvard.edu/abs/2025A%26A...699A.359B/abstract" target="_blank">
          <img src="{{site.baseurl}}/img/research/Ratios_all.png" alt="">
        </a>
      </figure>
      <figcaption class="project__caption cap-12c13c">
          <p href="https://ui.adsabs.harvard.edu/abs/2025A%26A...699A.359B/abstract" target="_blank">
            We derived the <sup>12</sup>C/<sup>13</sup>C isotopologue ratios using CH<sub>3</sub>OH and CH<sub>3</sub>CN in the warm gas surrounding seven Class 0/I protostars in the Perseus molecular cloud using PRODIGE data (red-shaded sources in above Fig.). The ratios are in the range  4-30, significantly below the local interstellar value of ~68. Astrochemical modelling suggests that this <sup>13</sup>C  enrichment may be inherited from precursor molecules formed during the prestellar phase. These results provide evidence that isotopic signatures established before star formation may persist into later stages of stellar and planetary evolution.
          </p>
      </figcaption>
    </div>
