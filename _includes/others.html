            <u>Re-exploring Molecular Complexity with ALMA (ReMoCA) in Sgr B2(N1) and its outflow</u>
          </a>
        </div>
      <figure class="project__pic pic-remoca1">
        <a href="https://ui.adsabs.harvard.edu/abs/2022A%26A...665A..96B/abstract" target="_blank">
          <img src="{{site.baseurl}}/img/research/shapes1.png" alt="">

        </a>
      </figure>
      <figcaption class="project__caption"> 
        <p><b>Resolving desorption of COMs in a hot core:</b> Using the 3mm ReMoCA ALMA survey, we investigated the spatial distribution and chemistry of COMs in Sagittarius B2(N1). We modelled ten COMs under LTE conditions and derived spatially resolved temperature, column-density, and abundance profiles towards the South and West from from the continuum peak. The temperature profiles range from 80-300K and are consistent with heating of the protostellar envelope. O- and N-bearing COMs show distinct abundance trends: N-bearing species peak at the highest temperatures, while most O-bearing COMs peak at lower temperatures and remain constant or decrease towards hotter regions. Comparison with astrochemical models suggests that many O-bearing COMs are formed on dust grains and thermally desorb at around 100K, likely together with water, while some N-bearing COMs are substantially formed in the gas phase. The detection of COMs below 100K further indicates an additional low-temperature desorption mechanism. This study provides the first spatially resolved evidence for two distinct regimes of COM desorption in a hot core.
</p>
      </figcaption>

      <figure class="project__pic pic-remoca2">
        <a href="https://ui.adsabs.harvard.edu/abs/2024A%26A...681A.104B/abstract" target="_blank">
          <img src="{{site.baseurl}}/img/research/SgrB2_overview.png" alt="">
          <img src="{{site.baseurl}}/img/research/SgrB2_outflow_chem.png" alt="">
        </a>
      </figure>
      <figcaption class="project__caption">
        <p> <b>A new perspective on O/N dichotomy:</b> 
            In a second project, we investigated the morphology and chemistry of small molecules and COMs in the outflow of Sgr B2(N1). We modelled spectra of twelve COMs and four smaller species under LTE conditions and derived rotational temperatures and column densities in both outflow lobes. The SO and SiO emission reveals a complex bipolar structure, with wider-angle emission also traced by S-bearing molecules and several N-bearing COMs. Rotational temperatures range from ~100-200K, and abudnances of N-bearing molecules are enhanced relative to CH<sub>3</sub>OH in the outflow compared with (not shocked) hot-core material. Unlike the shock-affected regions L1157-B1 and G+0.693-0.027, the molecular abundances show no clear correlation, suggesting that the Sgr B2(N1) outflow experienced different initial conditions or shock chemistry. We propose that hot-core chemistry preceded the shock, after which compression and heating accelerated the destruction of mainly O-bearing molecules, while gas-phase formation helped preserve or enhance cyanides and cyanopolyynes. These results highlight the importance of the local environment in shaping shock chemistry.
        </p>
      </figcaption>
